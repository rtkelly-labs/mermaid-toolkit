version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - '@biomejs/*'
          - 'vitest'
          - '@vitest/*'
          - 'tsup'
          - 'tsx'
          - 'typescript'
          - 'publint'
          - '@arethetypeswrong/*'
          - 'size-limit'
          - '@size-limit/*'
        update-types:
          - minor
          - patch
    labels:
      - 'type:chore'
      - 'dependencies'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - 'type:chore'
      - 'dependencies'
      - 'area:build-ci'
