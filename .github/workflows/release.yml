name: Release

# Manual, human-gated publish to npm. Trigger from the Actions tab
# ("Run workflow"). Requires an `NPM_TOKEN` repo secret (an npm automation
# token with publish rights to the @rtkelly-labs scope).
#
# `id-token: write` + publishConfig.provenance enable npm provenance, so the
# published package is cryptographically linked to this workflow run.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and validate only — do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates (lint, typecheck, test, build, exports, size)
        run: pnpm run ci

      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: pnpm publish --no-git-checks --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
