name: Release

# Manual, human-gated publish to npm. Trigger from the Actions tab
# ("Run workflow").
#
# Publishes via npm Trusted Publishing (OIDC), so there is no NPM_TOKEN
# secret: npm trusts this exact workflow file, configured on the package's
# npmjs.com settings page, and attaches provenance itself. npm >= 11.5 is
# needed for the token exchange, and Node 22 bundles an older one.
#
# The version is package.json's, unchanged. A prerelease (`0.1.0-alpha.0`)
# belongs on `next`, so `latest` only ever names a version meant for everyone.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and validate only — do not publish'
        type: boolean
        default: true
      dist-tag:
        description: 'npm dist-tag to publish under'
        type: choice
        options:
          - next
          - latest
        default: next

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      # A prerelease on `latest` becomes what a bare install resolves to.
      - name: Keep prereleases off latest
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${DIST_TAG}" = latest ] && [[ "${version}" == *-* ]]; then
            echo "::error::${version} is a prerelease; publish it under 'next', not 'latest'."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates (lint, typecheck, test, build, exports, size)
        run: pnpm run ci

      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: npm publish --tag "${{ inputs.dist-tag }}" --dry-run

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --tag "${{ inputs.dist-tag }}"
