name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint / typecheck / test / build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify filesystem structure & script extensions
        uses: ls-lint/action@a87c5eb4fb26d7af1bd0adba203dd1e76f7e94eb # v2.3.2
        with:
          config: .ls-lint.yml

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check (biome)
        run: pnpm lint

      - name: Typecheck (tsc)
        run: pnpm typecheck

      - name: Unit tests + coverage
        run: pnpm test:coverage

      - name: Build (ESM + CJS + types)
        run: pnpm build

      - name: Validate package exports (publint + are-the-types-wrong)
        run: pnpm check:exports

      - name: Bundle-size guardrail (size-limit)
        run: pnpm size

      - name: Examples smoke test
        run: pnpm examples

      - name: Upload coverage report
        if: matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  usage:
    name: Consumer usage check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Pack the real publish artifact and install it into a throwaway project,
      # exactly as a downstream consumer would — this exercises the exports map
      # (ESM import + CJS require) against the built dist, not the source.
      - name: Pack tarball
        run: |
          pnpm build
          echo "TARBALL=$(pnpm pack | tail -1)" >> "$GITHUB_ENV"

      - name: Install tarball into a clean project
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"

      - name: Import as ESM
        working-directory: /tmp/consumer
        run: |
          cat > esm.mjs <<'EOF'
          import { mermaidToAscii, renderSvg } from '@rtkelly-labs/mermaid-toolkit';
          const out = mermaidToAscii('graph LR\n A[Hi] --> B[There]');
          if (!out.includes('Hi') || !out.includes('There')) throw new Error('ESM render failed');
          const svgResult = renderSvg('graph LR\n A --> B');
          if (!svgResult.svg.includes('<svg')) throw new Error('ESM renderSvg failed');
          console.log('ESM import OK');
          EOF
          node esm.mjs

      - name: Require as CJS
        working-directory: /tmp/consumer
        run: |
          cat > cjs.cjs <<'EOF'
          const { mermaidToAscii, renderSvg } = require('@rtkelly-labs/mermaid-toolkit');
          const out = mermaidToAscii('graph LR\n A[Hi] --> B[There]', { asciiOnly: true });
          if (!out.includes('Hi')) throw new Error('CJS render failed');
          const svgResult = renderSvg('graph LR\n A --> B');
          if (!svgResult.svg.includes('<svg')) throw new Error('CJS renderSvg failed');
          console.log('CJS require OK');
          EOF
          node cjs.cjs

  bench:
    name: Benchmarks & PR performance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run benchmarks (current)
        run: |
          mkdir -p temp
          pnpm exec vitest bench --run --outputJson temp/current-bench.json

      - name: Run baseline benchmarks (main)
        if: github.event_name == 'pull_request'
        run: |
          git checkout origin/main
          pnpm install --frozen-lockfile
          pnpm exec vitest bench --run --outputJson temp/base-bench.json
          git checkout -

      - name: Compare performance against baseline
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec tsx scripts/bench-compare.ts temp/base-bench.json temp/current-bench.json --out=temp/bench-summary.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: temp/*bench*.json
          if-no-files-found: ignore

  # Single required status check to gate merges on. Branch protection requires
  # just "PR checks" instead of every matrix leg, so adding/removing a Node
  # version never needs a protection-rule edit. Fails if any dependency failed
  # or was cancelled/skipped.
  pr-checks:
    name: pr-checks
    if: always()
    needs: [check, usage, bench]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "check=${{ needs.check.result }}"
          echo "usage=${{ needs.usage.result }}"
          echo "bench=${{ needs.bench.result }}"
          if [ "${{ needs.check.result }}" != "success" ] \
            || [ "${{ needs.usage.result }}" != "success" ] \
            || [ "${{ needs.bench.result }}" != "success" ]; then
            echo "::error::One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded."
